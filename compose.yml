name: lf9-lab

# Laborübungsplatz LF9, Zonenmodell nach Pflichtenheft V1.2 (Kapitel 3 bis 6)
# Profile: ohne Angabe laufen Pflicht- und Wahldienste (dns, web, ftp, smb, db, kuma, voip, caddy, pihole, nextcloud, adminer, grafana, loki, promtail, homepage, portainer);
#          "test" startet zusätzlich den Test-Client für tests/run-tests.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  br-web:
    name: br-web
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-web
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.20.0/24
          gateway: 10.20.20.1
  br-infra:
    name: br-infra
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-infra
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.30.0/24
          gateway: 10.20.30.1
  br-files:
    name: br-files
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-files
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.40.0/24
          gateway: 10.20.40.1
  br-db:
    name: br-db
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-db
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.50.0/24
          gateway: 10.20.50.1

  br-voip:
    name: br-voip
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-voip
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.60.0/24
          gateway: 10.20.60.1

volumes:
  ftp-data:
  smb-data:
  db-data:
  kuma-data:
  caddy-data:
  pihole-data:
  nextcloud-data:
  grafana-data:
  loki-data:
  portainer-data:

services:
  # --- Pflichtdienste -------------------------------------------------------
  dns:
    build: ./bind9
    image: lf9-lab/bind9:1
    container_name: lf9-dns
    restart: unless-stopped
    logging: *logging
    networks:
      br-infra:
        ipv4_address: 10.20.30.2
    healthcheck:
      test: ["CMD-SHELL", "dig +short +time=2 +tries=1 @127.0.0.1 www.kopernikus-lab.lokal | grep -q 10.20.20.4"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: nginx:1.27-alpine
    container_name: lf9-web
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./web/conf.d:/etc/nginx/conf.d:ro
      - ./web/sites:/usr/share/nginx/sites:ro
    networks:
      br-web:
        ipv4_address: 10.20.20.4
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      dns:
        condition: service_healthy

  ftp:
    build: ./ftp
    image: lf9-lab/vsftpd:1
    container_name: lf9-ftp
    restart: unless-stopped
    logging: *logging
    environment:
      FTP_USER1_PASSWORD: ${FTP_USER1_PASSWORD:?in .env setzen}
      FTP_USER2_PASSWORD: ${FTP_USER2_PASSWORD:?in .env setzen}
    volumes:
      - ftp-data:/srv/ftp
    networks:
      br-files:
        ipv4_address: 10.20.40.2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/21'"]
      interval: 15s
      timeout: 5s
      retries: 5

  smb:
    build: ./smb
    image: lf9-lab/samba:1
    container_name: lf9-smb
    restart: unless-stopped
    logging: *logging
    environment:
      SMB_USER1_PASSWORD: ${SMB_USER1_PASSWORD:?in .env setzen}
      SMB_USER2_PASSWORD: ${SMB_USER2_PASSWORD:?in .env setzen}
    volumes:
      - smb-data:/srv/samba
    networks:
      br-files:
        ipv4_address: 10.20.40.3
    healthcheck:
      test: ["CMD-SHELL", "smbclient -L //127.0.0.1 -N -m SMB3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Wahldienste ----------------------------------------------------------
  db:
    image: mariadb:11.4
    container_name: lf9-db
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?in .env setzen}
      MARIADB_ROOT_HOST: localhost
      DB_WEB_PASSWORD: ${DB_WEB_PASSWORD:?in .env setzen}
      DB_NEXTCLOUD_PASSWORD: ${DB_NEXTCLOUD_PASSWORD:?in .env setzen}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      br-db:
        ipv4_address: 10.20.50.2
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10

  kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: lf9-kuma
    restart: unless-stopped
    logging: *logging
    volumes:
      - kuma-data:/app/data
    networks:
      br-infra:
        ipv4_address: 10.20.30.3

  voip:
    build: ./voip
    image: lf9-lab/asterisk:1
    container_name: lf9-voip
    restart: unless-stopped
    logging: *logging
    environment:
      SIP_1001_PASSWORD: ${SIP_1001_PASSWORD:?in .env setzen}
      SIP_1002_PASSWORD: ${SIP_1002_PASSWORD:?in .env setzen}
    networks:
      br-voip:
        ipv4_address: 10.20.60.2
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- Zusatzdienste (Zone 20 und 30) ---------------------------------------
  caddy:
    image: caddy:2.11.7-alpine
    container_name: lf9-caddy
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      br-web:
        ipv4_address: 10.20.20.2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  pihole:
    image: pihole/pihole:2026.10.1
    container_name: lf9-pihole
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: ${TZ:-Europe/Berlin}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:?in .env setzen}
      FTLCONF_dns_upstreams: "10.20.30.2"
      FTLCONF_dns_listeningMode: all
    volumes:
      - pihole-data:/etc/pihole
    networks:
      br-web:
        ipv4_address: 10.20.20.3

  nextcloud:
    image: nextcloud:35.0.2-apache
    container_name: lf9-nextcloud
    restart: unless-stopped
    logging: *logging
    environment:
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.kopernikus-lab.lokal nextcloud.kopernikus-lab.lokal 10.20.20.5"
    volumes:
      - nextcloud-data:/var/www/html
    networks:
      br-web:
        ipv4_address: 10.20.20.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1/status.php >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s

  adminer:
    image: adminer:5.5.1
    container_name: lf9-adminer
    restart: unless-stopped
    logging: *logging
    environment:
      ADMINER_DEFAULT_SERVER: "10.20.50.2"
    networks:
      br-web:
        ipv4_address: 10.20.20.6

  grafana:
    image: grafana/grafana:13.2
    container_name: lf9-grafana
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?in .env setzen}
      GF_SERVER_ROOT_URL: "http://logs.kopernikus-lab.lokal/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      br-infra:
        ipv4_address: 10.20.30.4
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.6.11
    container_name: lf9-loki
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./logging/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      br-infra:
        ipv4_address: 10.20.30.5

  promtail:
    image: grafana/promtail:3.6.11
    container_name: lf9-promtail
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./logging/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      br-infra:
        ipv4_address: 10.20.30.6
    depends_on:
      - loki

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: lf9-homepage
    restart: unless-stopped
    logging: *logging
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "portal.kopernikus-lab.lokal,10.20.30.8:3000,10.20.30.8"
    volumes:
      - ./homepage/config:/app/config
    networks:
      br-infra:
        ipv4_address: 10.20.30.8

  portainer:
    image: portainer/portainer-ce:2.45.3-alpine
    container_name: lf9-portainer
    restart: unless-stopped
    logging: *logging
    volumes:
      - portainer-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      br-infra:
        ipv4_address: 10.20.30.9

  # --- Test-Client (nur Profil "test", nur für den lokalen Test) -------------
  client:
    build: ./client
    image: lf9-lab/client:1
    container_name: lf9-client
    profiles: ["test"]
    dns:
      - 10.20.30.2
    networks:
      br-web:
        ipv4_address: 10.20.20.250
      br-infra:
        ipv4_address: 10.20.30.250
      br-files:
        ipv4_address: 10.20.40.250
      br-db:
        ipv4_address: 10.20.50.250
      br-voip:
        ipv4_address: 10.20.60.250
