; SIP-Konfiguration Übungslabor: zwei Nebenstellen, nur UDP, ohne NAT (Zone 60, 10.20.60.2)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-base](!)
type=endpoint
context=intern
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1001](endpoint-base)
auth=auth1001
aors=1001
[auth1001]
type=auth
auth_type=userpass
username=1001
password=@SIP_1001_PASSWORD@
[1001]
type=aor
max_contacts=1
remove_existing=yes

[1002](endpoint-base)
auth=auth1002
aors=1002
[auth1002]
type=auth
auth_type=userpass
username=1002
password=@SIP_1002_PASSWORD@
[1002]
type=aor
max_contacts=1
remove_existing=yes
