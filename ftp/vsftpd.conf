# FTP-Server des Übungslabors (Pflichtenheft Kapitel 6.4)
# Bewusst unverschlüsselt: Die Protokollanalyse soll Anmeldung und Befehle im Klartext zeigen.
listen=YES
listen_ipv6=NO
background=NO

# Anonym: nur /pub, nur lesen
anonymous_enable=YES
anon_root=/srv/ftp/pub
no_anon_password=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO

# Benutzer user1/user2: chroot im eigenen Verzeichnis, Schreibrecht
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
user_sub_token=$USER
local_root=/srv/ftp/users/$USER

# Passivmodus mit festem Portbereich (Firewall-Regel 21100-21110/TCP)
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=10.20.40.2

# Protokollierung nach stdout (Docker-Log, später Loki)
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log
dual_log_enable=NO
syslog_enable=NO

# Betrieb im Container
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
ftpd_banner=Willkommen im Uebungslabor (Kopernikus Hochschule)
