# Zwei Websites über zwei FQDNs (virtuelle Hosts), www ist zugleich Standard-Host
server {
    listen 80 default_server;
    server_name www.kopernikus-lab.lokal;
    root /usr/share/nginx/sites/www;
    index index.html;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

server {
    listen 80;
    server_name web2.kopernikus-lab.lokal;
    root /usr/share/nginx/sites/web2;
    index index.html;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
