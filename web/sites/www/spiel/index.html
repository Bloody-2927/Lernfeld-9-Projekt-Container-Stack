<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paket-Jäger – Heiner-IT Minispiel</title>
  <style>
    :root { --bg: #0b1220; --panel: #121c30; --line: #22304d; --text: #e8eefc; --muted: #9db0d3; --a: #4cc9f0; --b: #7ae582; --bad: #f72585; }
    * { box-sizing: border-box; margin: 0; }
    body { font: 16px/1.5 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .box { width: min(92vw, 440px); text-align: center; }
    h1 { font-size: 1.6rem; } p { color: var(--muted); font-size: .92rem; margin: 6px 0 14px; }
    .bar { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
    canvas { width: 100%; aspect-ratio: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; touch-action: none; display: block; }
    .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; justify-content: center; margin-top: 14px; }
    .pad button { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 1.2rem; cursor: pointer; }
    .pad button:active { background: var(--a); color: #04121f; }
    .pad .u { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
    .start { margin-top: 14px; padding: 10px 22px; border: 0; border-radius: 10px; background: var(--a); color: #04121f; font-weight: 700; cursor: pointer; }
    a { color: var(--a); font-size: .88rem; display: inline-block; margin-top: 16px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Paket-Jäger</h1>
    <p>Steuere den Datenstrom mit den Pfeiltasten (oder den Knöpfen), sammle Pakete ein und weiche der Wand und dir selbst aus.</p>
    <div class="bar"><span>Pakete: <span id="score">0</span></span><span>Rekord: <span id="best">0</span></span></div>
    <canvas id="c" width="360" height="360" role="img" aria-label="Spielfeld Paket-Jäger: Pfeiltasten steuern den Datenstrom"></canvas>
    <p id="status" class="sr" role="status" aria-live="polite"></p>
    <div class="pad">
      <button class="u" data-d="u" aria-label="hoch">▲</button><button class="l" data-d="l" aria-label="links">◀</button>
      <button class="d" data-d="d" aria-label="runter">▼</button><button class="r" data-d="r" aria-label="rechts">▶</button>
    </div>
    <button class="start" id="go">Start</button><br>
    <a href="../">← zurück zu Heiner-IT Systems</a>
  </div>
  <script>
    const cv = document.getElementById('c'), cx = cv.getContext('2d'), N = 18, S = cv.width / N;
    let snake, dir, next, food, score, best = 0, timer = null;
    try { best = +localStorage.getItem('paketjaeger') || 0; } catch (e) {}
    document.getElementById('best').textContent = best;
    const dirs = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
    function reset() {
      snake = [[9, 9], [8, 9], [7, 9]]; dir = next = dirs.r; score = 0; place();
      document.getElementById('score').textContent = 0;
    }
    function place() {
      do { food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)]; }
      while (snake.some(s => s[0] === food[0] && s[1] === food[1]));
    }
    function turn(k) { const d = dirs[k]; if (d && (d[0] + dir[0] || d[1] + dir[1])) next = d; }
    function step() {
      dir = next; const h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
      if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || snake.some(s => s[0] === h[0] && s[1] === h[1])) return over();
      snake.unshift(h);
      if (h[0] === food[0] && h[1] === food[1]) { score++; document.getElementById('score').textContent = score; place(); clearInterval(timer); timer = setInterval(step, Math.max(60, 130 - score * 4)); }
      else snake.pop();
      draw();
    }
    function draw() {
      cx.clearRect(0, 0, cv.width, cv.height);
      cx.fillStyle = '#f72585'; cx.fillRect(food[0] * S + 4, food[1] * S + 4, S - 8, S - 8);
      snake.forEach((s, i) => { cx.fillStyle = i ? '#4cc9f0' : '#7ae582'; cx.fillRect(s[0] * S + 1, s[1] * S + 1, S - 2, S - 2); });
    }
    function over() {
      clearInterval(timer); timer = null;
      if (score > best) { best = score; document.getElementById('best').textContent = best; try { localStorage.setItem('paketjaeger', best); } catch (e) {} }
      cx.fillStyle = '#0b1220cc'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.fillStyle = '#e8eefc'; cx.font = 'bold 26px system-ui'; cx.textAlign = 'center';
      cx.fillText('Verbindung getrennt', cv.width / 2, cv.height / 2 - 6);
      cx.font = '16px system-ui'; cx.fillText(score + ' Pakete – nochmal?', cv.width / 2, cv.height / 2 + 22);
      document.getElementById('go').textContent = 'Neustart';
      document.getElementById('status').textContent = 'Verbindung getrennt, ' + score + ' Pakete.';
    }
    function start() { clearInterval(timer); reset(); draw(); document.getElementById('status').textContent = 'Spiel gestartet.'; timer = setInterval(step, 130); }
    document.getElementById('go').onclick = start;
    document.querySelectorAll('.pad button').forEach(b => b.onclick = () => turn(b.dataset.d));
    addEventListener('keydown', e => {
      const m = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r' }[e.key];
      if (m && timer) { e.preventDefault(); turn(m); }
    });
    let t0;
    cv.addEventListener('touchstart', e => { t0 = e.touches[0]; });
    cv.addEventListener('touchend', e => {
      const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u'));
    });
    reset(); draw();
  </script>
</body>
</html>
