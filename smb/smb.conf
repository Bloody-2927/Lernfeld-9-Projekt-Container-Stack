# Samba-Dateiserver des Übungslabors (Pflichtenheft Kapitel 6.4)
[global]
    workgroup = LAB
    server string = Uebungslabor Fileserver
    server role = standalone server
    security = user
    map to guest = Bad User
    server min protocol = SMB2_02
    disable netbios = yes
    smb ports = 445
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    logging = stdout
    log level = 1

# Freier Downloadbereich, nur lesen
[pub]
    path = /srv/samba/pub
    read only = yes
    guest ok = yes

# Persönliche Freigaben, nur mit Anmeldung
[Benutzer1]
    path = /srv/samba/Benutzer1
    valid users = benutzer1
    read only = no
    guest ok = no
    create mask = 0644
    directory mask = 0755

[Benutzer2]
    path = /srv/samba/Benutzer2
    valid users = benutzer2
    read only = no
    guest ok = no
    create mask = 0644
    directory mask = 0755
