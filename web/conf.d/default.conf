# Zwei Websites über zwei FQDNs (virtuelle Hosts), www ist zugleich Standard-Host
server {
    listen 80 default_server;
    server_name www.kopernikus-lab.lokal;
    root /usr/share/nginx/sites/www;
    index index.html;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

server {
    listen 80;
    server_name web2.kopernikus-lab.lokal;
    root /usr/share/nginx/sites/web2;
    index index.html;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}

# Intranet: nur aus den Clients (VMs 192.168.10.11 bis .13) und dem Labor-Inneren erreichbar, der Windows-PC bekommt 403
server {
    listen 80;
    server_name intern.kopernikus-lab.lokal;
    root /usr/share/nginx/sites/intern;
    index index.html;
    allow 192.168.10.11;
    allow 192.168.10.12;
    allow 192.168.10.13;
    allow 10.20.0.0/16;
    deny all;
    error_page 403 /_403.html;
    location = /_403.html { internal; allow all; }
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
